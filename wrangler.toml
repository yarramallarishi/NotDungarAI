name = "not-dungar-ai"
main = "src/worker.ts"
compatibility_date = "2026-10-24"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "not-dungar-ai"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
AUTH0_DOMAIN = "REPLACE_WITH_YOUR_AUTH0_DOMAIN"
AUTH0_CLIENT_ID = "REPLACE_WITH_YOUR_AUTH0_APPLICATION_CLIENT_ID"
AUTH0_AUDIENCE = "REPLACE_WITH_YOUR_AUTH0_API_IDENTIFIER"
DAILY_REQUEST_LIMIT = "50"
